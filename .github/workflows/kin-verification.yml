name: Kin verification

on:
  pull_request:
    paths:
      - "projects/kin/**"
      - ".github/workflows/kin-verification.yml"
  push:
    branches: [kin-development]
    paths:
      - "projects/kin/**"
      - ".github/workflows/kin-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kin-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Install pinned Rust and WASM target
        shell: pwsh
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.93.0
      - name: Install Kin dependencies
        working-directory: projects/kin
        run: npm ci
      - name: Prepare ignored WASM asset for browser regressions
        working-directory: projects/kin
        run: ./build-wasm.ps1
      - name: Run verification and browser gates
        working-directory: projects/kin
        shell: pwsh
        env:
          KIN_BROWSER: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        # On failure, the failing lines and the end of the output are also
        # reported as one annotation, which the checks API returns even where
        # the full job log can't be downloaded (#164).
        run: |
          npm run verify:browser 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/kin-verify.txt"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $all = Get-Content "$env:RUNNER_TEMP/kin-verify.txt"
            $failing = $all | Select-String -Pattern 'FAIL|Error|not ok|AssertionError|timed out' | Select-Object -Last 40 | ForEach-Object { $_.Line }
            $message = (@($failing) + '--- last lines ---' + ($all | Select-Object -Last 40)) -join "`n"
            if ($message.Length -gt 60000) { $message = $message.Substring($message.Length - 60000) }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Kin verification failed::$message"
          }
          exit $code

  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Install pinned Rust and WASM target
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.93.0
      - name: Install Kin dependencies
        working-directory: projects/kin
        run: npm ci
      - name: Exercise Linux WASM launcher
        working-directory: projects/kin
        run: ./build-wasm.sh
      - name: Run browserless verification
        working-directory: projects/kin
        run: node scripts/verify.mjs
