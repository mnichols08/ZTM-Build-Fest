# PROPOSAL ONLY. GitHub does not discover workflows below projects/kin.
# Copy to repository-root .github/workflows/ only after scope authorization.
name: Kin verification (proposal)

on:
  pull_request:
    branches: [kin-development]
    paths:
      - "projects/kin/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kin-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
      - name: Install pinned Rust and WASM target
        shell: pwsh
        run: rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
      - name: Install Kin dependencies
        working-directory: projects/kin
        run: npm ci
      - name: Prepare ignored WASM asset for browser regressions
        working-directory: projects/kin
        run: ./build-wasm.ps1
      - name: Run verification and browser gates
        working-directory: projects/kin
        env:
          KIN_BROWSER: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        run: npm run verify:browser
