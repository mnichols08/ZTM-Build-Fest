# Reference copy of the active repository-root Kin workflow.
# Keep this project-local documentation synchronized with
# /.github/workflows/kin-verification.yml.
name: Kin verification

on:
  pull_request:
    paths:
      - "projects/kin/**"
      - ".github/workflows/kin-verification.yml"
  push:
    branches: [kin-development]
    paths:
      - "projects/kin/**"
      - ".github/workflows/kin-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kin-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Install pinned Rust and WASM target
        shell: pwsh
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.93.0
      - name: Install Kin dependencies
        working-directory: projects/kin
        run: npm ci
      - name: Prepare ignored WASM asset for browser regressions
        working-directory: projects/kin
        run: ./build-wasm.ps1
      - name: Run verification and browser gates
        working-directory: projects/kin
        shell: pwsh
        env:
          KIN_BROWSER: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        # On failure, the failing lines and the end of the output are also
        # reported as annotations, which the checks API returns even where
        # the full job log can't be downloaded (#164).
        run: |
          npm run verify:browser 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/kin-verify.txt"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Annotations are cut at about 4 KB and a step may emit 10, so
            # lines are shortened and sent in chunks, failing lines first.
            $all = Get-Content "$env:RUNNER_TEMP/kin-verify.txt" | ForEach-Object { if ($_.Length -gt 300) { $_.Substring(0, 300) + '…' } else { $_ } }
            $failing = $all | Select-String -CaseSensitive -Pattern 'FAIL|Error|not ok|timed out' | ForEach-Object { $_.Line } | Select-Object -Last 30
            $sections = @(@{ title = 'Kin verification failed - failing lines'; lines = @($failing) }, @{ title = 'Kin verification failed - last lines'; lines = @($all | Select-Object -Last 40) })
            foreach ($section in $sections) {
              $chunk = ''
              $part = 1
              foreach ($line in $section.lines) {
                if (($chunk.Length + $line.Length) -gt 3800) {
                  Write-Output "::error title=$($section.title) ($part)::$($chunk.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A'))"
                  $chunk = ''
                  $part += 1
                }
                $chunk += "$line`n"
              }
              if ($chunk) { Write-Output "::error title=$($section.title) ($part)::$($chunk.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A'))" }
            }
          }
          exit $code

  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Install pinned Rust and WASM target
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.93.0
      - name: Install Kin dependencies
        working-directory: projects/kin
        run: npm ci
      - name: Exercise Linux WASM launcher
        working-directory: projects/kin
        run: ./build-wasm.sh
      - name: Run browserless verification
        working-directory: projects/kin
        run: node scripts/verify.mjs
